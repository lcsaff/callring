name: Verify build

# Continuous verification for pull requests and feature branches. No Secrets are
# used: the release/variant builds here are throwaway debug-keystore builds whose
# only purpose is to feed the release-tooling failure-sample self test.
# Real signing and publishing live in release.yml.

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # This repository only ships gradlew.bat, so CI drives Gradle 8.13 directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate version source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/version_tool.py check

      - name: Byte-compile release tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/release/*.py

      - name: Run unified verification
        shell: bash
        run: |
          set -euo pipefail
          gradle :backend:test :ui:testDebugUnitTest :app:testDebugUnitTest \
            :app:assembleDebug :ui:lintDebug :app:lintDebug --console=plain

      # app/build.gradle falls back to ~/.android/debug.keystore when
      # signing.properties is absent; create a throwaway one for this build only.
      - name: Create throwaway debug keystore for the signing fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Throwaway debug keystore created (this build is never released)."

      - name: Assemble release APK for the tooling self test
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --console=plain

      - name: Release tooling failure-sample self test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/selftest.py
