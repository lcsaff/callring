apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.greatwall.callring'
    compileSdkVersion 33
    buildToolsVersion '33.0.0'
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    defaultConfig {
        applicationId 'com.greatwall.callring'
        minSdkVersion 29
        targetSdkVersion 33
        versionCode 2
        versionName '0.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildTypes {
        backendQa {
            initWith debug
            applicationIdSuffix '.backendqa'
            versionNameSuffix '-backend-qa'
            matchingFallbacks = ['debug']
        }
    }
    sourceSets {
        backendQa {
            java.srcDirs = ['src/debug/java', 'src/debug/kotlin', 'src/backendQa/kotlin']
            manifest.srcFile 'src/backendQa/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation project(':backend')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    testImplementation 'junit:junit:4.13.2'
}
