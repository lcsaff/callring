apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def callringVersion = rootProject.ext.callringVersion

// Release signing material never lives in the repository. The preferred source is a
// gitignored signing.properties at the repository root:
//   storeFile=<absolute path to .jks/.keystore>
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// When that file is absent (fresh checkout / local dev) fall back to this machine's
// Android debug keystore, which is the current release identity (see app-update
// design §六). CI must inject signing.properties from Secrets instead of relying
// on this fallback: the workflow fails when the Secrets are missing.
def releaseSigningPropertiesFile = rootProject.file('signing.properties')
def releaseSigning
if (releaseSigningPropertiesFile.isFile()) {
    def signingProps = new Properties()
    releaseSigningPropertiesFile.withInputStream { signingProps.load(it) }
    def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningKeys = signingKeys.findAll { !(signingProps.getProperty(it) ?: '').trim() }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException("signing.properties is missing required keys: ${missingSigningKeys.join(', ')}")
    }
    releaseSigning = [
        storeFile    : rootProject.file(signingProps.getProperty('storeFile').trim()),
        storePassword: signingProps.getProperty('storePassword').trim(),
        keyAlias     : signingProps.getProperty('keyAlias').trim(),
        keyPassword  : signingProps.getProperty('keyPassword').trim(),
    ]
} else {
    // C:\Users\GreatWall\.android\debug.keystore on this machine (same path the
    // app-update design records; user.home keeps checkout portability).
    def fallbackDebugKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
    releaseSigning = [
        storeFile    : fallbackDebugKeystore,
        storePassword: 'android',
        keyAlias     : 'androiddebugkey',
        keyPassword  : 'android',
    ]
}

android {
    namespace 'com.greatwall.callring'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    signingConfigs {
        release {
            storeFile releaseSigning.storeFile
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }
    defaultConfig {
        applicationId 'com.greatwall.callring'
        minSdkVersion 29
        targetSdkVersion 33
        versionCode callringVersion.code
        versionName callringVersion.name
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        backendQa {
            initWith debug
            applicationIdSuffix '.backendqa'
            versionNameSuffix '-backend-qa'
            matchingFallbacks = ['debug']
        }
    }
    sourceSets {
        backendQa {
            java.srcDirs = ['src/debug/java', 'src/debug/kotlin', 'src/backendQa/kotlin']
            manifest.srcFile 'src/backendQa/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation project(':ui')
    implementation project(':backend')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.callringVersions.coroutines}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
