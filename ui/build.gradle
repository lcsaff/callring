plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.greatwall.callring.ui'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        minSdk 29
        testInstrumentationRunner 'com.greatwall.callring.ui.testing.UiTestRunner'
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test.java.srcDir 'src/sharedTest/kotlin'
        androidTest.java.srcDir 'src/sharedTest/kotlin'
    }
}

dependencies {
    implementation project(':backend')
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.callringVersions.composeBom}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.mikepenz:multiplatform-markdown-renderer:0.40.2'
    implementation 'com.mikepenz:multiplatform-markdown-renderer-m3:0.40.2'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.5'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.callringVersions.coroutines}"
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${rootProject.ext.callringVersions.coroutines}"
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.callringVersions.composeBom}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
