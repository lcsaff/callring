<style>

y:flex;align-items:center;gap:5px;font-size:11px;opacity:.85}.hero h4{font-size:23px;font-weight:650;line-height:1.35;margin:14px 0 8px}.hero p{margin:0;font-size:11px;line-height:1.75;opacity:.82}.hero-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff35;padding-top:12px;margin-top:16px}.hero-bottom span{font-size:10px}.pill{display:inline-flex;align-items:center;gap:4px;border-radius:7px;font-size:10px;padding:5px 7px;background:var(--tint);color:var(--primary);white-space:nowrap}.hero .pill{background:#ffffff20;color:var(--on-primary)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:17px 1px 10px}.section-title h4{font-size:13px;margin:0;font-weight:650}.link{font-size:11px;color:var(--primary);background:transparent;padding:4px}.panel{border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);padding:14px;margin-bottom:10px}.panel-title{font-size:13px;font-weight:650;margin:0 0 6px}.secondary{font-size:11px;line-height:1.7;color:var(--muted);margin:0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.person{display:flex;align-items:center;gap:10px;min-width:0}.avatar{background:var(--tint);color:var(--primary);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:650;flex-shrink:0}.person .panel-title{margin:0 0 3px}.person .secondary{font-size:10px}.metric{font-size:22px;font-weight:650;color:var(--primary);letter-spacing:-1px}.metric small{font-size:9px;margin-left:3px;font-weight:400;letter-spacing:0}.split-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.small-metric .metric{color:var(--ink);font-size:24px;margin-top:9px}.small-metric .secondary{font-size:10px}.small-metric{padding:13px}.footnote{margin:8px 1px;color:var(--muted);font-size:10px;line-height:1.6}.divider{height:1px;background:var(--line);margin:13px 0}.switch{width:34px;height:21px;border-radius:15px;position:relative;background:var(--primary);flex-shrink:0}.switch:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--on-primary);top:3px;right:3px}.switch.off{background:var(--line)}.switch.off:after{right:auto;left:3px;background:var(--muted)}.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 8px 12px;flex-shrink:0}.nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px;padding:0}.nav .nav-icon{padding:4px 14px;border-radius:14px}.nav button.current{color:var(--primary);font-weight:650}.nav button.current .nav-icon{background:var(--tint)}.nav .icon{width:18px;height:18px}.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:12px}.filters{display:flex;gap:6px;margin:10px 0 15px;flex-wrap:wrap}.chip{border:1px solid var(--line);color:var(--muted);background:var(--surface);padding:7px 9px;border-radius:8px;font-size:10px}.chip.chosen{background:var(--tint);color:var(--primary);border-color:transparent}.score-panel{background:var(--tint);text-align:center}.score-value{font-size:55px;font-weight:600;letter-spacing:-3px;line-height:1.2;color:var(--primary);margin:8px 0}.score-value span{font-size:12px;letter-spacing:0;margin-left:5px}.formula{font-size:10px;color:var(--muted);line-height:1.6;margin-top:10px}.timeline{border-left:1px solid var(--line);margin-left:4px;padding-left:13px;position:relative}.timeline:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--primary);position:absolute;top:5px;left:-4px}.timeline .panel-title{font-size:12px}.warning{color:var(--warning)}.action-button{width:100%;padding:12px;background:var(--primary);color:var(--on-primary);border-radius:10px;font-size:12px;margin-top:10px}.action-button.outlined{background:transparent;color:var(--primary);border:1px solid var(--line)}.settings-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.settings-row:last-child{border-bottom:0;padding-bottom:2px}.settings-row:first-child{padding-top:2px}.settings-row .icon{color:var(--primary)}.settings-row .words{flex:1}.chevron{font-size:18px;color:var(--muted)}.field-label{display:block;font-size:11px;color:var(--muted);margin:15px 0 7px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.field:focus{border-color:var(--primary)}.choose{background:#fff;border:1px solid #d1d6ce;color:#536052;width:100%;padding:11px;margin-top:14px;border-radius:9px;font-size:12px}.selected .choose{background:#263d33;color:white;border-color:#263d33}.description{padding:12px 2px 0;color:#747b73;font-size:11px;line-height:1.7;min-height:50px}.description strong{color:#3e493e}.selection{padding:17px 20px;border:1px solid #dce2d8;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:24px}.selection small{color:#7b8278}.selection strong{font-size:13px}.mock-toast{position:absolute;bottom:87px;left:20px;right:20px;background:var(--ink);color:var(--surface);padding:13px;border-radius:12px;font-size:11px;box-shadow:0 4px 15px #0002;z-index:2}.support-heading{font-size:12px;color:var(--muted);margin:21px 2px 10px}.overlay-sample{border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 20px #0001;margin:30px 0;padding:13px}.drag-line{width:28px;height:3px;border-radius:2px;background:var(--line);margin:0 auto 12px}.overlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;color:var(--muted);font-size:10px}.inline-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}.inline-actions button{background:var(--tint);color:var(--primary);border-radius:8px;padding:9px 3px;font-size:10px}.empty{padding:48px 15px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);margin-top:20px}.empty .icon{width:34px;height:34px;color:var(--muted)}.empty h4{font-size:14px;margin:17px 0 10px}.empty p{color:var(--muted);font-size:11px;line-height:1.8}.widget{margin-top:40px}.widget .hero{margin:0}.widget .metric{color:var(--on-primary)}.widget .person .panel-title{color:var(--on-primary)}.widget .person .secondary{color:var(--on-primary);opacity:.7}.widget .avatar{background:#ffffff20;color:var(--on-primary)}.widget .inline-actions button{background:#ffffff20;color:var(--on-primary)}.large .appbar h3{font-size:25px}.large .panel-title{font-size:16px}.large .secondary,.large .footnote{font-size:13px}.large .pill,.large .chip{font-size:12px}.large .hero p{font-size:13px}footer{color:#7a8278;font-size:11px;display:flex;justify-content:space-between;gap:20px;line-height:1.8}.intro,footer,.selection{flex-wrap:wrap}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card:last-child{grid-column:1/-1;max-width:370px;justify-self:center;width:100%}}@media(max-width:680px){header,.workspace,footer{padding:18px}.cards{grid-template-columns:1fr;max-width:375px;margin:auto}.card:last-child{grid-column:auto;max-width:none}.intro h1{font-size:25px}.stage,.preview-label{display:none}.toolbar .spacer{display:none}.toolbar{gap:3px}.tab{padding:9px 10px}.selection{align-items:flex-start;flex-direction:column}.brand span{margin-left:8px}}

<body>
<header><div class="brand">callring<span>来电管理 · 设计预览</span></div><div class="stage">01 / 视觉方向 → 页面交互 → 完整设计确认</div></header>
<main class="workspace">
<div class="intro"><div><h1>来电之间，留一点安静。</h1><p>相同内容，三种视觉方向。切换页面、深色模式和大字，比较日常使用的感受。</p></div><div class="preview-label">展示数据均为设计示例</div></div>
<div class="toolbar" role="group" aria-label="预览页面">
<button class="tab active" data-page="home">首页</button><button class="tab" data-page="callers">档案</button><button class="tab" data-page="report">报表</button><button class="tab" data-page="settings">设置</button><button class="tab" data-page="edit">编辑</button><button class="tab" data-page="surfaces">悬浮窗 / 小组件</button>
<span class="spacer"></span><button id="dark" class="control" aria-pressed="false">深色模式</button><button id="font" class="control" aria-pressed="false">大字预览</button>
</div>
<div class="cards" id="directions"></div>
<div class="selection" aria-live="polite"><strong id="selection-text">尚未选择 · 推荐先比较 A 和 B</strong><small>点击“选择这个方向”，然后回到聊天说明你希望保留或调整的部分。</small></div>
</main>
<footer><span>当前是视觉方案预览，交互不会修改应用数据。Android 源码尚未变更。</span><span>页面、悬浮窗和小组件共享颜色、文字层级与状态语义。</span></footer>
<script>
const drawings={home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5.65"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4 10-10"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6zM8 12l3 3 5-6"/>',chart:'<path d="M4 3v17h17M8 15v-4M13 15V6M18 15v-7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/>',phone:'<path d="M7 3H3v4c0 8 6 14 14 14h4v-4l-5-2-2 3c-4-1-7-4-8-8l3-2z"/>',back:'<path d="m14 5-7 7 7 7"/>',edit:'<path d="m15 5 4 4M4 20l4-1L20 7l-4-4L4 15z"/>'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${drawings[name]||drawings.home}</svg>`;
const styles=[{id:'calm',name:'A · 安静青绿',className:'',description:'<strong>推荐。</strong> 温和底色与清晰留白，强调工作状态、来电人和主要操作。适合每天使用。'},{id:'blue',name:'B · 专业靛蓝',className:'blue',description:'信息分组更有工具感，适合频繁查看档案、评分与报表；保持清晰、克制的层级。'},{id:'sand',name:'C · 暖灰极简',className:'sand',description:'更少彩色强调，通过文字、边界与留白组织信息。视觉安静，状态需要更明确的文字辅助。'}];
let page='home',dark=false,large=false,selected=null;
function caller(name='陈明',number='31234',meta='研发部 · 部门主管 ↑',score=95){return `<div class="row"><div class="person"><div class="avatar">${name[0]}</div><div><div class="panel-title">${name} <span style="font-weight:400;font-size:10px;color:var(--muted)">${number}</span></div><p class="secondary">${meta}</p></div></div><div class="metric">${score}<small>分</small></div></div>`}
function setting(title,subtitle,ico){return `<button class="settings-row" style="width:100%;text-align:left;background:transparent;color:inherit" onclick="previewToast(this,'预览：进入${title}设置')">${icon(ico)}<span class="words"><span class="panel-title" style="display:block;margin:0 0 2px">${title}</span><span class="secondary">${subtitle}</span></span><span class="chevron">›</span></button>`}
const content={
home:()=>`<div class="hero"><div class="eyebrow">${icon('shield')} 来电管理已就绪</div><h4>安心工作，<br>下班后少些打扰。</h4><p>非工作时间静音已开启<br>白名单来电按原设置放行</p><div class="hero-bottom"><span>今天 · 周四</span><span class="pill">${icon('clock')} 工作中</span></div></div><div class="split-metrics"><div class="panel small-metric"><p class="secondary">今日已记录来电</p><div class="metric">6 <small>次</small></div></div><div class="panel small-metric"><p class="secondary">非工作时间来电</p><div class="metric">1 <small>次</small></div></div></div><div class="section-title"><h4>最近来电</h4><button class="link" onclick="switchPage('report')">查看报表 ›</button></div><button class="panel" style="width:100%;text-align:left;color:inherit" onclick="switchPage('report')">${caller()}<div class="divider"></div><div class="row"><span class="secondary">今天 10:24 · 已接听</span><span class="pill">白名单</span></div></button><div class="section-title"><h4>规则铃声</h4><button class="link" onclick="switchPage('settings')">设置 ›</button></div><div class="panel"><div class="row"><div><div class="panel-title">内置短旋律</div><p class="secondary">用于 3 开头的五位号码</p></div><button class="switch" aria-label="规则铃声已开启" onclick="this.classList.toggle('off')"></button></div></div><p class="footnote">统计仅包含应用已记录的来电。</p>`,
callers:()=>`<div class="search">${icon('search')} 搜索号码、姓名或部门</div><div class="filters"><button class="chip chosen">全部档案</button><button class="chip" onclick="chooseChip(this)">白名单</button><button class="chip" onclick="chooseChip(this)">有来电记录</button></div><div class="section-title"><h4>号码档案</h4><span class="secondary">3 个号码</span></div>${[['陈明','31234','研发部 · 部门主管 ↑',95],['李晓','31235','运营部 · 专员 ＝',88],['王宁','31236','财务部 · 未设置职位',100]].map(a=>`<button class="panel" style="display:block;width:100%;color:inherit;text-align:left" onclick="switchPage('report')">${caller(...a)}<div class="divider"></div><span class="secondary">近 30 天评分 · 点击查看报表</span></button>`).join('')}<button class="action-button" onclick="switchPage('edit')">＋ 新增号码档案</button><p class="footnote">分数越低，表示该号码越不受欢迎。</p>`,
report:()=>`<div class="panel">${caller()}</div><div class="filters"><button class="chip" onclick="chooseChip(this)">今天</button><button class="chip" onclick="chooseChip(this)">近 7 天</button><button class="chip chosen" onclick="chooseChip(this)">近 30 天</button><button class="chip" onclick="previewToast(this,'预览：选择开始和结束日期')">自定义</button></div><div class="panel score-panel"><p class="secondary">近 30 天号码评分</p><div class="score-value">95<span>分</span></div><p class="secondary">分数越低，号码越不受欢迎</p><div class="formula">100 − 非工作 1 次 × 5 − 重复 0 次 × 2</div></div><div class="split-metrics"><div class="panel small-metric"><p class="secondary">区间来电</p><div class="metric">12<small>次</small></div></div><div class="panel small-metric"><p class="secondary">非工作来电</p><div class="metric">1<small>次</small></div></div></div><div class="section-title"><h4>逐次明细</h4><button class="link" onclick="previewToast(this,'预览：选择明细分类')">筛选 ${icon('settings')}</button></div><div class="panel"><div class="timeline"><div class="row"><div class="panel-title">今天 10:24</div><span class="pill">工作时间</span></div><p class="secondary">已接听 · 通话 01:15</p><p class="secondary">白名单放行</p></div><div class="divider"></div><div class="timeline"><div class="row"><div class="panel-title">昨天 20:16</div><span class="pill" style="color:var(--warning)">非工作时间</span></div><p class="secondary">未接听 · 时长未知</p><p class="secondary">应用免打扰静音</p></div></div><div class="row"><button class="link" onclick="previewToast(this,'预览：已安排通话结果同步')">同步通话结果</button><button class="link" onclick="previewToast(this,'预览：选择 CSV 保存位置')">导出 CSV</button></div><p class="footnote">汇总按整个区间计算，明细筛选仅影响列表。</p>`,
settings:()=>`<div class="panel"><div class="row"><div><div class="panel-title">应用免打扰</div><p class="secondary">全部非工作时间静音</p></div><button class="switch" aria-label="应用免打扰已开启" onclick="this.classList.toggle('off')"></button></div><div class="divider"></div><p class="secondary">今天工作时段：09:00–12:00 · 13:00–18:00</p></div><div class="section-title"><h4>时间与来电规则</h4></div><div class="panel">${setting('工作安排','每周时段、时区、单日调整','clock')}${setting('节假日与请假','2026 年已核验 · 管理个人请假','calendar')}${setting('免打扰规则','静音时段、号码范围与白名单','moon')}${setting('评分规则','观察天数、扣分和重复间隔','chart')}</div><div class="section-title"><h4>个人与显示</h4></div><div class="panel">${setting('职位管理','我的职位与可选职位','people')}${setting('铃声与来电卡片','选择音频、悬浮窗和桌面小组件','bell')}${setting('外观','跟随系统 · 青绿主题','settings')}</div><div class="section-title"><h4>权限与运行状态</h4></div><div class="panel">${setting('授权与后台运行','来电识别已设置 · 查看完整状态','shield')}</div>`,
edit:()=>`<p class="secondary">姓名、部门与职位用于来电卡片和号码报表。</p><label class="field-label">号码</label><input class="field" value="31234" inputmode="tel" aria-label="号码"><label class="field-label">姓名</label><input class="field" value="陈明" aria-label="姓名"><label class="field-label">部门</label><input class="field" value="研发部" aria-label="部门"><label class="field-label">职位</label><select class="field" aria-label="职位"><option>部门主管 · 层级 2</option><option>专员 · 层级 3</option><option>未设置职位</option></select><p class="footnote">↑ 高于我的当前职位</p><div class="panel" style="margin-top:22px"><div class="row"><div><div class="panel-title">加入白名单</div><p class="secondary">绕过应用免打扰，遵守系统静音</p></div><button class="switch" aria-label="加入白名单" onclick="this.classList.toggle('off')"></button></div></div><button class="action-button" onclick="previewToast(this,'预览：档案已保存，应用数据未修改')">保存档案</button><button class="action-button outlined" onclick="switchPage('report')">查看号码报表</button>`,
surfaces:()=>`<p class="secondary">同一视觉规范，按不同使用场景调整信息密度。</p><div class="support-heading">来电悬浮窗 · 展开状态</div><div class="overlay-sample"><div class="drag-line"></div><div class="overlay-header"><span>来电档案 · 可拖动</span><span>收起　关闭</span></div>${caller()}<div class="divider"></div><div class="row"><span class="secondary">工作时间 · 正常响铃</span><span class="pill">白名单</span></div><div class="inline-actions"><button onclick="switchPage('edit')">编辑信息</button><button onclick="previewToast(this,'预览：切换白名单')">白名单</button><button onclick="switchPage('report')">报表</button></div></div><div class="support-heading">桌面小组件 · 中等尺寸</div><div class="widget"><div class="hero">${caller()}<div class="hero-bottom"><span>近 30 天 · 12 次来电</span><span class="pill">工作中</span></div><p style="margin-top:13px">最近来电 · 今天 10:24<br>应用免打扰：非工作时间静音</p><div class="inline-actions"><button onclick="switchPage('edit')">编辑</button><button onclick="switchPage('report')">报表</button><button onclick="previewToast(this,'预览：刷新小组件')">刷新</button></div></div></div><p class="footnote" style="margin-top:14px">解锁后显示个人信息；锁屏时隐藏。<br>小组件最终布局需在 Android 桌面验证。</p>`
};
const titles={home:['周四，工作顺利','来电管理'],callers:['记录与维护','号码档案'],report:['陈明 · 31234','来电报表'],settings:['按自己的节奏','设置'],edit:['号码档案','编辑信息'],surfaces:['应用之外','来电卡片']};
function navigation(){const current=page==='home'?'home':page==='settings'?'settings':'callers';return `<nav class="nav" aria-label="应用导航">${[['home','首页','home'],['callers','档案','people'],['settings','设置','settings']].map(([key,label,ico])=>`<button class="${current===key?'current':''}" onclick="switchPage('${key}')"><span class="nav-icon">${icon(ico)}</span>${label}</button>`).join('')}</nav>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page)});document.getElementById('directions').innerHTML=styles.map(s=>`<article class="card ${selected===s.id?'selected':''}" id="style-${s.id}"><div class="direction"><h2>${s.name}</h2>${s.id==='calm'?'<span class="recommend">推荐方向</span>':''}</div><div class="phone ${s.className} ${dark?'dark':''} ${large?'large':''}"><div class="statusbar"><span>09:41</span><span class="status-right">5G <span class="battery"></span></span></div><div class="appbar"><div><small>${titles[page][0]}</small><h3>${titles[page][1]}</h3></div><button class="icon-button" aria-label="${page==='callers'?'新增档案':'查看设置'}" onclick="switchPage('${page==='callers'?'edit':'settings'}')">${icon(page==='callers'?'edit':'settings')}</button></div><div class="screen">${content[page]()}</div>${navigation()}</div><div class="description">${s.description}</div><button class="choose" data-choice="${s.id}" onclick="selectStyle('${s.id}')">${selected===s.id?'已选择此方向':'选择这个方向'}</button></article>`).join('');}
function switchPage(value){page=value;render()}
function selectStyle(id){selected=id;document.getElementById('selection-text').textContent='已选择：'+styles.find(s=>s.id===id).name;render();if(window.brainstorm)window.brainstorm.choice(id,{page,dark,large});}
function chooseChip(button){button.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.remove('chosen'));button.classList.add('chosen');previewToast(button,'预览：已选择 '+button.textContent)}
function previewToast(button,text){const phone=button.closest('.phone');phone.querySelector('.mock-toast')?.remove();const toast=document.createElement('div');toast.className='mock-toast';toast.textContent=text;toast.setAttribute('role','status');phone.appendChild(toast);setTimeout(()=>toast.remove(),2400)}
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>switchPage(button.dataset.page)));
document.getElementById('dark').addEventListener('click',function(){dark=!dark;this.setAttribute('aria-pressed',dark);this.textContent=dark?'切换浅色':'深色模式';render()});
document.getElementById('font').addEventListener('click',function(){large=!large;this.setAttribute('aria-pressed',large);this.textContent=large?'恢复字号':'大字预览';render()});
render();
</script>
</body>
</html>
